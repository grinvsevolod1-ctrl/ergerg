<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="nexikGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d4aa;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#0a0a0f"/>
  <!-- N letter stylized as AI brain/network -->
  <g fill="url(#nexikGradient)">
    <!-- Left vertical bar -->
    <rect x="120" y="140" width="50" height="232" rx="25"/>
    <!-- Right vertical bar -->
    <rect x="342" y="140" width="50" height="232" rx="25"/>
    <!-- Diagonal connection -->
    <polygon points="145,165 170,140 367,347 392,372 367,372 170,165"/>
    <!-- AI dots/nodes -->
    <circle cx="145" cy="180" r="18" opacity="0.8"/>
    <circle cx="367" cy="332" r="18" opacity="0.8"/>
    <circle cx="256" cy="256" r="14" opacity="0.6"/>
    <!-- Connection lines (neural network effect) -->
    <rect x="163" y="172" width="80" height="4" rx="2" transform="rotate(45 203 174)" opacity="0.4"/>
    <rect x="269" y="280" width="80" height="4" rx="2" transform="rotate(45 309 282)" opacity="0.4"/>
  </g>
  <!-- Subtle glow ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#nexikGradient)" stroke-width="2" opacity="0.3"/>
</svg>
