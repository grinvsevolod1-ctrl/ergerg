<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Main gradient for the orb -->
    <radialGradient id="orbGradient" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#7FFFD4"/>
      <stop offset="50%" stop-color="#00ffff"/>
      <stop offset="80%" stop-color="#00b8b8"/>
      <stop offset="100%" stop-color="#008080"/>
    </radialGradient>
    
    <!-- Outer glow -->
    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ffff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#00ffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00ffff" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Core highlight -->
    <radialGradient id="coreGradient" cx="35%" cy="35%" r="40%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00ffff" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Filter for soft glow effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background glow -->
  <circle cx="32" cy="32" r="30" fill="url(#glowGradient)"/>
  
  <!-- Outer ring glow 1 -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="#00ffff" stroke-width="0.5" opacity="0.3"/>
  
  <!-- Outer ring glow 2 -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="#00ffff" stroke-width="0.3" opacity="0.2"/>
  
  <!-- Main orb blob shape (slightly irregular for liquid effect) -->
  <path d="M32 8 
    C44 8 52 14 54 24 
    C56 34 52 44 44 50 
    C36 56 24 56 16 48 
    C8 40 8 28 14 18 
    C20 10 26 8 32 8Z" 
    fill="url(#orbGradient)" 
    filter="url(#glow)"/>
  
  <!-- Inner light blob for depth -->
  <ellipse cx="28" cy="26" rx="14" ry="12" fill="url(#coreGradient)"/>
  
  <!-- Small highlight reflection -->
  <ellipse cx="24" cy="22" rx="6" ry="4" fill="white" opacity="0.7" transform="rotate(-20 24 22)"/>
  
  <!-- Tiny sparkle dots -->
  <circle cx="42" cy="18" r="1.5" fill="white" opacity="0.8"/>
  <circle cx="46" cy="28" r="1" fill="white" opacity="0.6"/>
  <circle cx="20" cy="44" r="1" fill="#00ffff" opacity="0.5"/>
</svg>
